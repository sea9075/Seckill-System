services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: seckill-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  api:
    build:
      context: .
      dockerfile: src/Seckill.Api/Dockerfile
    container_name: seckill-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionString__Default: "Server=mssql,1443;Database=SeckillSystemDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Redis__ConnecttionString: "redis:6379"
    ports:
      - "${API_PORT}:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mssql-data:
  redis-data: